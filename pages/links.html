<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友情链接 - 寒羽凌夜</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; padding-top: 50px; }
    .container.mt-5 { flex: 1; }
    footer { margin-top: auto; }
    .link-card { margin-bottom: 1.5rem; }
    .link-card img { height: 150px; object-fit: cover; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">寒羽凌夜</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">主页</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">关于我</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="blog/blog.html">博客</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="links.html">友链</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">友情链接</h2>
    <p class="text-muted mb-5">支持喵</p>

    <div class="row" id="links-container"></div>
  </div>

  <footer class="bg-dark text-white text-center py-4">
    <div class="container">
      <p>© 2026 寒羽凌夜</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const links = [
      { name: '罗码术', desc: '好玩', img: 10, url: 'https://www.luomashu.com/?utm_source=keyboard' },
      { name: '菜鸟教程', desc: '伟大无需多言', img: 11, url: 'https://www.runoob.com/' }
    ];

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('links-container');
      const shuffledLinks = shuffleArray([...links]);
      
      shuffledLinks.forEach(link => {
        const col = document.createElement('div');
        col.className = 'col-md-4';
        col.innerHTML = `
          <div class="card link-card">
            <img src="https://picsum.photos/400/300?random=${link.img}" class="card-img-top" alt="${link.name}">
            <div class="card-body">
              <h5 class="card-title">${link.name}</h5>
              <p class="card-text">${link.desc}</p>
              <a href="${link.url}" class="btn btn-primary" target="_blank">访问网站</a>
            </div>
          </div>
        `;
        container.appendChild(col);
      });
    });
  </script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
